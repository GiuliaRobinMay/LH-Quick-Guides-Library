<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesko Help Quick Guide Library</title>
<meta name="description" content="The Lesko Help Business, Nonprofit and Career quick guides in one place. Open a guide, read or download the PDF, watch the lesson, and bookmark what you need.">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111827'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3ELH%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" data-action="home">
      <span class="brand-mark" aria-hidden="true">LH</span>
      <span class="brand-word">Lesko Help</span>
    </a>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search guides, lessons, organizations..." autocomplete="off" aria-label="Search guides">
      <button class="clear" id="q-clear" type="button" hidden aria-label="Clear search">&times;</button>
    </label>
  </div>
</header>

<main class="page">

  <!-- ===== Library ===== -->
  <section id="view-library" role="tabpanel" aria-label="Library">
    <div class="filterbar">
      <div class="chips" id="topics" role="group" aria-label="Topic"></div>
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="list" aria-pressed="true" title="List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
        <button type="button" data-view="cards" aria-pressed="false" title="Cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
      </div>
    </div>
    <div id="pinned" hidden>
      <button class="section-toggle" type="button" id="pinned-toggle" aria-expanded="true" aria-controls="pinned-grid">
        <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        <span class="section-toggle-title">Bookmarked</span>
        <span class="badge yellow" id="pinned-count">0</span>
      </button>
      <div class="rows" id="pinned-grid"></div>
    </div>
    <div class="section-head">
      <div><h2 id="grid-title">All guides</h2><p id="grid-sub">Business, nonprofit and career guides from Lesko Help.</p></div>
    </div>
    <div class="rows" id="grid" aria-live="polite"></div>
    <p class="foot-note"><span id="result-count"></span></p>
  </section>

</main>

<!-- ===== Viewer ===== -->
<div class="scrim" id="scrim" hidden></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
  <div class="viewer-head">
    <span class="eyebrow" id="viewer-eyebrow"></span>
    <span class="spacer"></span>
    <button class="icon-btn" type="button" data-action="prev" title="Previous" aria-label="Previous guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="icon-btn" type="button" data-action="next" title="Next" aria-label="Next guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="icon-btn" type="button" data-action="close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="viewer-body" id="viewer-body"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/guides.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
