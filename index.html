<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesko Help Quick Guide Library</title>
<meta name="description" content="Every Lesko Help quick guide in one searchable list. Filter by topic, open the guide, download the PDF, and bookmark the ones you need.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%232C4DC9'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' font-weight='700' fill='white' text-anchor='middle'%3E?%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="frame" aria-hidden="true"></div>

<div class="page">
  <header class="masthead">
    <a class="brand" href="#" data-action="home">
      <span class="brand-mark" aria-hidden="true">?</span>
      <span class="brand-word"><span class="top">Lesko</span><span class="bottom">Help</span></span>
    </a>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-library" aria-selected="true" aria-controls="view-library" data-tab="library">01 · The Library</button>
      <button class="tab" role="tab" id="tab-mine" aria-selected="false" aria-controls="view-mine" data-tab="mine">02 · Bookmarked <span class="badge" id="mine-badge" hidden>0</span></button>
    </nav>
  </header>

  <!-- ===== Library ===== -->
  <section id="view-library" role="tabpanel" aria-labelledby="tab-library">
    <div class="panel">
      <div class="toolbar">
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search…" autocomplete="off" aria-label="Search guides">
          <button class="clear" id="q-clear" type="button" hidden>Clear</button>
        </label>
        <div class="filter-row">
          <div id="topics" class="filter-row" role="group" aria-label="Topic"></div>
          <select id="topic-select" class="select" aria-label="More topics">
            <option value="">More topics…</option>
          </select>
          <span class="spacer"></span>
          <span class="legend" aria-hidden="true"><span class="dot guide"></span>Quick guide <span class="dot lesson"></span>Lesson</span>
        </div>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
      <p class="foot-note"><span id="result-count"></span> · Can't find what you need? <a href="#" data-action="go-request">Request a guide</a></p>
    </div>
  </section>

  <!-- ===== Bookmarked ===== -->
  <section id="view-mine" role="tabpanel" aria-labelledby="tab-mine" hidden>
    <div class="panel">
      <div class="filter-row" style="margin-bottom:12px">
        <span class="count" id="mine-count"></span>
        <span class="spacer"></span>
        <button class="btn small ghost" type="button" data-action="print">Print</button>
        <button class="btn small ghost" type="button" data-action="export">Copy my notes</button>
        <button class="btn small ghost" type="button" data-action="reset">Clear all</button>
      </div>
      <div class="list" id="mine-list"></div>
    </div>
  </section>

  <!-- ===== Request ===== -->
  <section id="view-request" role="tabpanel" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>Request a quick guide</h2>
        <button class="btn small ghost" type="button" data-action="home">← Back to the library</button>
      </div>
      <div class="two-col">
        <form class="form" id="request-form">
          <div class="field">
            <label for="rq-topic">Topic</label>
            <select id="rq-topic" class="select" required></select>
          </div>
          <div class="field">
            <label for="rq-title">What should the guide cover?</label>
            <input id="rq-title" type="text" required maxlength="120" placeholder="e.g. Grants for food trucks in Texas">
          </div>
          <div class="field">
            <label for="rq-why">Why do you need it? (optional)</label>
            <textarea id="rq-why" maxlength="800"></textarea>
            <span class="hint">Please do not include your SSN, bank details or other private numbers.</span>
          </div>
          <div class="field">
            <label for="rq-name">Your name (optional)</label>
            <input id="rq-name" type="text" maxlength="80">
          </div>
          <div class="cta-row" style="margin-top:4px">
            <button class="btn primary" type="submit">Save my request</button>
          </div>
        </form>
        <div>
          <div class="section-title"><h3>My requests</h3><span class="hint" id="rq-count"></span></div>
          <ul class="requests" id="requests"></ul>
        </div>
      </div>
    </div>
  </section>

  <footer class="site">
    <span>Lesko Help · Quick Guide Library</span>
    <span><a href="https://lesko-help-2.mn.co/collections/2517908" target="_blank" rel="noopener">Open the community ↗</a></span>
  </footer>
</div>

<!-- ===== Detail drawer ===== -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <span class="eyebrow" id="drawer-eyebrow"></span>
    <span class="spacer"></span>
    <button class="icon-btn" type="button" data-action="prev" title="Previous" aria-label="Previous guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="icon-btn" type="button" data-action="next" title="Next" aria-label="Next guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="icon-btn" type="button" data-action="close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/guides.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
